# Multi-node MPI dimer (2 nodes x 4 GPUs = 8-way wavelength split).
#
# Submit with:
#   sbatch --export=CONFIG=examples/dimer_multinode.yaml \
#          slurm_scripts/multi_node_2.slurm
# or:
#   qsub -v CONFIG=examples/dimer_multinode.yaml \
#        pbs_scripts/multi_node_2.pbs
#
# Each MPI rank uses 1 GPU explicitly (n_gpus_per_worker=1). For VRAM-pool
# pattern (rank uses all 4 GPUs of its host), see large_mesh_multinode.yaml.

structure:
  type: dimer_cube
  edge: 47.0
  gap: 0.6
  n_per_edge: 24
  e: 0.2
  refine: 3
  interp: curv

simulation:
  type: ret
  excitation: planewave
  enei_min: 500
  enei_max: 1000
  n_wavelengths: 100
  polarizations:
    - [1, 0, 0]
    - [0, 1, 0]
  propagation_dirs:
    - [0, 0, 1]
    - [0, 0, 1]
  interp: curv

materials:
  medium: water
  particle: gold

compute:
  n_workers: 1
  n_threads: 4
  n_gpus_per_worker: 1
  multi_node: true
  hmode: dense

output:
  dir: ./results
  name: dimer_multinode
  formats:
    - npz
    - json
    - png
  save_plots: true

postprocess:
  spectrum_xaxis: energy
  run_eigenmode_analysis: false
